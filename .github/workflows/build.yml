name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WEATHERYOU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/weatheryou.keystore"
            echo "WEATHERYOU_KEYSTORE=$RUNNER_TEMP/weatheryou.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret WEATHERYOU_KEYSTORE_BASE64 not set — APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          WEATHERYOU_KEYSTORE_PASSWORD: ${{ secrets.WEATHERYOU_KEYSTORE_PASSWORD }}
          WEATHERYOU_KEY_ALIAS: ${{ secrets.WEATHERYOU_KEY_ALIAS }}
          WEATHERYOU_KEY_PASSWORD: ${{ secrets.WEATHERYOU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "WeatherYou-2.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherYou-apk
          path: WeatherYou-*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Погода 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Material 3 Expressive погода: геолокация, живое небо, морфинг фигур.
            Установка: скачайте `WeatherYou-2.0.${{ github.run_number }}.apk` и откройте его на телефоне.
          files: WeatherYou-*.apk
