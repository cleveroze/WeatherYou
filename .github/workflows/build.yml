name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk WeatherYou.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherYou-release
          path: WeatherYou.apk
          if-no-files-found: error

      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WeatherYou · latest build
          body: |
            Свежий debug-APK, собранный из `main`.

            Установка: скачай `WeatherYou.apk` на телефон и открой файл.
            Нужно разрешить установку из этого источника.
          prerelease: true
          make_latest: false
          files: WeatherYou.apk
