name: Probe versions
on:
  push:
    branches: [ ccr-c84fc9a8-8h4la3 ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for a in androidx/compose/material3/material3 androidx/compose/compose-bom androidx/graphics/graphics-shapes androidx/activity/activity-compose androidx/core/core-ktx androidx/lifecycle/lifecycle-viewmodel-compose com/android/tools/build/gradle androidx/compose/material/material-icons-extended androidx/core/core-splashscreen; do
            echo "== $a"; curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -12 | tr '\n' ' '; echo
          done
          echo "== kotlin"; curl -s https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -8 | tr '\n' ' '
