name: Probe versions
on:
  push:
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>9\.[0-9]*\.[0-9]*</version>' | sed 's/<[^>]*>//g' | tr '\n' ' '; echo
          ls $ANDROID_HOME/platforms
